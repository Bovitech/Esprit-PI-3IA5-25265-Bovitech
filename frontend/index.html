<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .app {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: min(640px, calc(100vh - 2rem));
    }
    h1 {
      margin: 0;
      padding: 1rem 1.25rem;
      font-size: 1.125rem;
      font-weight: 600;
      border-bottom: 1px solid #e8eaed;
      background: #fafbfc;
    }
    #chatbox {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.65rem 0.9rem;
      border-radius: 12px;
      line-height: 1.45;
      font-size: 0.9375rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: #e8eaed;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: flex-start;
      background: #fee2e2;
      color: #991b1b;
      border-bottom-left-radius: 4px;
    }
    .composer {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem 1rem;
      border-top: 1px solid #e8eaed;
      background: #fafbfc;
    }
    #message-input {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    #message-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    #send-btn {
      padding: 0.65rem 1.1rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #send-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }
    #send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Chat</h1>
    <div id="chatbox" aria-live="polite"></div>
    <div class="composer">
      <input
        type="text"
        id="message-input"
        placeholder="Type a message…"
        autocomplete="off"
        aria-label="Message"
      />
      <button type="button" id="send-btn">Send</button>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/chatbot/";
    const chatbox = document.getElementById("chatbox");
    const input = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(text, role) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      chatbox.appendChild(el);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      appendMessage(text, "user");
      sendBtn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });

        let data;
        try {
          data = await res.json();
        } catch {
          appendMessage("Could not read server response.", "error");
          return;
        }

        if (!res.ok) {
          appendMessage(
            data.detail || data.error || "Request failed (" + res.status + ").",
            "error"
          );
          return;
        }

        if (typeof data.response === "string") {
          appendMessage(data.response, "bot");
        } else {
          appendMessage("Unexpected response from server.", "error");
        }
      } catch (err) {
        appendMessage(
          "Network error. Is the server running and CORS enabled?",
          "error"
        );
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
