<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bovitech — Assistant Bovin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2d6a4f;
    --green-light: #40916c;
    --green-pale: #d8f3dc;
    --cream: #faf7f2;
    --brown: #6b4f3a;
    --text: #1a1a1a;
    --muted: #7a7a6e;
    --border: #e8e2d9;
    --user-bg: #2d6a4f;
    --bot-bg: #ffffff;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-image: radial-gradient(circle at 20% 80%, #d8f3dc44 0%, transparent 50%),
                      radial-gradient(circle at 80% 20%, #b7e4c744 0%, transparent 50%);
  }

  .app {
    width: 440px;
    height: 680px;
    background: white;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    box-shadow: 0 8px 40px rgba(45, 106, 79, 0.12), 0 2px 8px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  /* HEADER */
  .header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: white;
  }

  .header-icon {
    width: 42px;
    height: 42px;
    background: var(--green-pale);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .header-text h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .header-text p {
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    margin-top: 1px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: #52b788;
    border-radius: 50%;
    margin-left: auto;
    box-shadow: 0 0 0 3px #d8f3dc;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px #d8f3dc; }
    50% { box-shadow: 0 0 0 5px #d8f3dc88; }
  }

  /* CHATBOX */
  #chatbox {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  #chatbox::-webkit-scrollbar { width: 4px; }
  #chatbox::-webkit-scrollbar-track { background: transparent; }
  #chatbox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .msg-row.user { align-items: flex-end; }
  .msg-row.bot { align-items: flex-start; }

  .msg {
    padding: 11px 15px;
    border-radius: var(--radius);
    max-width: 78%;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user {
    background: var(--user-bg);
    color: white;
    border-bottom-right-radius: 5px;
  }

  .msg.bot {
    background: var(--bot-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
  }

  /* TTS controls under bot message */
  .tts-controls {
    display: flex;
    gap: 6px;
    padding-left: 4px;
  }

  .tts-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }

  .tts-btn:hover:not(:disabled) {
    background: var(--green-pale);
    border-color: var(--green-light);
    color: var(--green);
  }

  .tts-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .tts-btn.playing {
    background: var(--green-pale);
    border-color: var(--green);
    color: var(--green);
  }

  /* COMPOSER */
  .composer {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    background: white;
  }

  #message-input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  #message-input:focus {
    border-color: var(--green-light);
    background: white;
  }

  #message-input::placeholder { color: var(--muted); }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  #mic-btn {
    background: var(--green-pale);
    color: var(--green);
  }

  #mic-btn:hover { background: #b7e4c7; }

  #mic-btn.recording {
    background: #ffe0e0;
    color: #c0392b;
    animation: rec-pulse 1s infinite;
  }

  @keyframes rec-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.3); }
    50% { box-shadow: 0 0 0 6px rgba(192, 57, 43, 0); }
  }

  #send-btn {
    background: var(--green);
    color: white;
  }

  #send-btn:hover { background: var(--green-light); }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 16px;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-bottom-left-radius: 5px;
    width: fit-content;
  }

  .typing span {
    width: 6px;
    height: 6px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  .fade-in {
    animation: fadeIn 0.2s ease;
  }

  /* Carte vétérinaire */
.vet-card {
  background: var(--green-pale);
  border: 1px solid var(--green-light);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 4px 0;
  line-height: 2;
}

.map-btn {
  display: inline-block;
  margin-top: 8px;
  padding: 7px 14px;
  background: var(--green);
  color: white;
  border-radius: 10px;
  text-decoration: none;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  transition: background 0.15s;
}

.map-btn:hover {
  background: var(--green-light);
}

/* Messages bot — meilleure lisibilité */
.msg.bot ul {
  padding-left: 18px;
  margin-top: 6px;
}

.msg.bot li {
  margin-bottom: 4px;
}

.msg.bot p {
  margin-bottom: 6px;
}

.msg.bot strong {
  color: var(--green);
}

/* Meteo card */
.meteo-card {
  border: 2px solid #2d6a4f;
  border-radius: 14px;
  padding: 14px 16px;
  margin: 4px 0;
  background: white;
  line-height: 1.9;
  font-size: 14px;
}

.meteo-header {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 4px;
}

.meteo-verdict {
  font-weight: 700;
  font-size: 15px;
}

.meteo-stats {
  color: var(--muted);
  font-size: 13px;
  margin: 6px 0;
  background: var(--cream);
  border-radius: 8px;
  padding: 5px 10px;
  display: inline-block;
}

.meteo-reason {
  margin-top: 4px;
}

.meteo-tip {
  margin-top: 6px;
  font-style: italic;
  color: var(--muted);
}

/* Feed card */
.feed-card {
  border: 2px solid #52b788;
  border-radius: 14px;
  padding: 14px 16px;
  background: white;
  margin: 4px 0;
  line-height: 1.9;
  font-size: 14px;
}

.feed-title {
  font-weight: 700;
  font-size: 15px;
  margin-bottom: 6px;
  color: var(--green);
}

.feed-stats {
  font-size: 12px;
  color: var(--muted);
  background: var(--cream);
  border-radius: 8px;
  padding: 4px 10px;
  display: inline-block;
  margin-bottom: 8px;
}

.feed-row {
  display: flex;
  gap: 8px;
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
}

.feed-label {
  font-weight: 600;
  min-width: 140px;
  color: var(--text);
}

.feed-warning {
  margin-top: 8px;
  color: #e67e22;
  font-weight: 600;
}

.feed-tip {
  margin-top: 8px;
  font-style: italic;
  color: var(--muted);
}

/* Meteo rain warning */
.meteo-rain-warn {
  color: #2980b9;
  font-size: 13px;
  margin: 4px 0;
}

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-icon">🐄</div>
    <div class="header-text">
      <h1 id="app-title">BovItech</h1>
      <p id="app-subtitle">Assistant spécialisé en élevage bovin</p>
    </div>

    <!-- 🔥 AJOUT ICI -->
    <select id="lang-select" style="
      margin-left: auto;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 12px;
    ">
      <option value="fr">Français</option>
      <option value="ar">العربية</option>
    </select>

    <div class="status-dot"></div>
  </div>

  <div id="chatbox"></div>

  <div class="composer">
    <button id="mic-btn" class="icon-btn" type="button" title="Microphone">🎤</button>
    <input id="message-input" placeholder="Posez votre question…" autocomplete="off" />
    <button id="send-btn" class="icon-btn" type="button" title="Envoyer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
const API_URL = "http://127.0.0.1:8000/chatbot/";
const chatbox = document.getElementById("chatbox");
const input = document.getElementById("message-input");
const sendBtn = document.getElementById("send-btn");
const micBtn = document.getElementById("mic-btn");

let currentLang = localStorage.getItem("lang") || "fr";
let userLocation = { lat: null, lon: null };

const langSelect = document.getElementById("lang-select");

//init
langSelect.value = currentLang;

//appliquer direction au chargement
document.body.dir = currentLang === "ar" ? "rtl" : "ltr";

// placeholder dynamique
input.placeholder = currentLang === "ar"
  ? "اكتب سؤالك..."
  : "Posez votre question…";

//changement langue
langSelect.onchange = () => {
  currentLang = langSelect.value;
  localStorage.setItem("lang", currentLang);

  document.body.dir = currentLang === "ar" ? "rtl" : "ltr";

  input.placeholder = currentLang === "ar"
    ? "اكتب سؤالك..."
    : "Posez votre question…";
  updateLanguageUI(); // 🔥 AJOUT ICI
};

let sessionId = localStorage.getItem("session_id") || crypto.randomUUID();
localStorage.setItem("session_id", sessionId);

let currentAudio = null;
let currentPlayBtn = null;
let currentStopBtn = null;

function updateLanguageUI() {
  if (currentLang === "ar") {
    document.getElementById("app-title").textContent = "بوفيتاك";
    document.getElementById("app-subtitle").textContent = "مساعد متخصص في تربية الأبقار";
  } else {
    document.getElementById("app-title").textContent = "BovItech";
    document.getElementById("app-subtitle").textContent = "Assistant spécialisé en élevage bovin";
  }
}
updateLanguageUI();

function addMsg(text, role) {
  const row = document.createElement("div");
  row.className = "msg-row " + role + " fade-in";

  const msg = document.createElement("div");
  msg.className = "msg " + role;
  msg.innerHTML = text; 
  row.appendChild(msg);

  let playBtn = null;
  let stopBtn = null;

  if (role === "bot") {
    const controls = document.createElement("div");
    controls.className = "tts-controls";

    playBtn = document.createElement("button");
    playBtn.className = "tts-btn";
    playBtn.innerHTML = "🔊 Écouter";
    playBtn.disabled = true;
    playBtn.onclick = () => playTTS(msg.textContent, playBtn, stopBtn);

    stopBtn = document.createElement("button");
    stopBtn.className = "tts-btn";
    stopBtn.innerHTML = "⏹ Stop";
    stopBtn.disabled = true;
    stopBtn.onclick = () => stopAudio();

    controls.appendChild(playBtn);
    controls.appendChild(stopBtn);
    row.appendChild(controls);
  }

  chatbox.appendChild(row);
  chatbox.scrollTop = chatbox.scrollHeight;
  return { msg, playBtn, stopBtn };
}

function addTyping() {
  const row = document.createElement("div");
  row.className = "msg-row bot fade-in";
  row.id = "typing-row";
  row.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  chatbox.appendChild(row);
  chatbox.scrollTop = chatbox.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById("typing-row");
  if (t) t.remove();
}

async function sendMessage(customText = null) {
  const text = customText || input.value.trim();
  if (!text) return;
  if (!customText) input.value = "";

  addMsg(text, "user");
  addTyping();

  try {
    
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
      message: text,
      session_id: sessionId,
      lang: currentLang,
      lat: userLocation.lat,
      lon: userLocation.lon
    })
    });

    if (!res.ok) {
      removeTyping();
      addMsg("❌ Server error", "bot");
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    let botMsg = null;
    let playBtn = null;
    let stopBtn = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunkText = decoder.decode(value, { stream: true });

      if (!botMsg) {
        removeTyping();
        const created = addMsg("", "bot");
        botMsg = created.msg;
        playBtn = created.playBtn;
        stopBtn = created.stopBtn;
      }

      botMsg.innerHTML += chunkText.replace(/\n/g, "<br>");
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    if (playBtn) playBtn.disabled = false;

  } catch (err) {
    console.error(err);
    removeTyping();
    addMsg("❌ Network error", "bot");
  }
}

function stopAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  if (currentPlayBtn) {
    currentPlayBtn.innerHTML = "🔊 Écouter";
    currentPlayBtn.classList.remove("playing");
    currentPlayBtn.disabled = false;
  }
  if (currentStopBtn) {
    currentStopBtn.disabled = true;
  }
  currentPlayBtn = null;
  currentStopBtn = null;
}

async function playTTS(text, playBtn, stopBtn) {
  stopAudio();

  try {
    playBtn.innerHTML = "⏳ Chargement…";
    playBtn.disabled = true;

    const res = await fetch("http://127.0.0.1:8000/chatbot/tts/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
      text: text,
      lang: currentLang
    })
    });

    const blob = await res.blob();
    const audioUrl = URL.createObjectURL(blob);

    currentAudio = new Audio(audioUrl);
    currentPlayBtn = playBtn;
    currentStopBtn = stopBtn;

    playBtn.innerHTML = "🔊 En cours…";
    playBtn.classList.add("playing");
    stopBtn.disabled = false;

    currentAudio.onended = () => stopAudio();
    currentAudio.play();

  } catch (err) {
    console.error(err);
    playBtn.innerHTML = "🔊 Écouter";
    playBtn.disabled = false;
    alert("Erreur audio");
  }
}

sendBtn.onclick = () => sendMessage();
input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault(); 
    sendMessage();
  }
});

// MICRO
let mediaRecorder;
let audioChunks = [];
let isRecording = false;

micBtn.onclick = async () => {
  if (!isRecording) {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = (event) => {
      if (event.data && event.data.size > 0) audioChunks.push(event.data);
    };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());

      const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
      const formData = new FormData();
      formData.append("audio", audioBlob, "audio.webm");
      formData.append("lang", currentLang);

      try {
        const res = await fetch("http://127.0.0.1:8000/chatbot/stt/", {
          method: "POST",
          body: formData
        });

        const data = await res.json();
        console.log("STT reçu:", data);

        if (data.status === "incomprehensible") {
          // 🔥 Message discret dans le placeholder, pas d'alert
          input.placeholder = currentLang === "ar"
            ? "⚠️ صوت غير مفهوم، حاول مجدداً..."
            : "⚠️ Audio incompréhensible, réessayez...";

          // Remettre le placeholder normal après 3 secondes
          setTimeout(() => {
            input.placeholder = currentLang === "ar"
              ? "اكتب سؤالك..."
              : "Posez votre question…";
          }, 3000);

        } else if (data.text && data.text.trim() !== "") {
          input.value = data.text;
          input.focus();
        }

      } catch (err) {
        console.error(err);
        input.placeholder = currentLang === "ar"
          ? "⚠️ خطأ، حاول مجدداً..."
          : "⚠️ Erreur réseau, réessayez...";
        setTimeout(() => {
          input.placeholder = currentLang === "ar"
            ? "اكتب سؤالك..."
            : "Posez votre question…";
        }, 3000);
      }
    };

    mediaRecorder.start(1000);
    isRecording = true;
    micBtn.textContent = "⏹";
    micBtn.classList.add("recording");
    micBtn.title = "Arrêter";

  } else {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
    isRecording = false;
    micBtn.textContent = "🎤";
    micBtn.classList.remove("recording");
    micBtn.title = "Microphone";
  }
};

function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve({ lat: null, lon: null });
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        console.log("✅ RAW POSITION:", pos); 

        resolve({
          lat: pos.coords.latitude,
          lon: pos.coords.longitude
        });
      },
      (err) => {
        console.error("Location error:", err);
        resolve({ lat: null, lon: null });
      },
      {
        enableHighAccuracy: true,  
        timeout: 10000,
        maximumAge: 0               
      }
    );
  });
}
window.onload = async () => {
  userLocation = await getLocation();
  console.log("📍 Location:", userLocation);
};
</script>
</body>
</html>
